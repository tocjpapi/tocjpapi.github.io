<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#333">Ride-Sharing Service Workflow</text>
  
  <!-- Start Node -->
  <circle cx="400" cy="70" r="15" fill="#4CAF50"/>
  <text x="400" y="75" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Start</text>
  
  <!-- Main Flow -->
  <path d="M 400 85 L 400 110" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Passenger Requests Ride -->
  <rect x="350" y="110" width="100" height="40" rx="5" fill="#FF9800"/>
  <text x="400" y="135" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Request Ride</text>
  
  <!-- System Finds Driver -->
  <path d="M 400 150 L 400 180" stroke="#333" stroke-width="2" fill="none"/>
  <rect x="350" y="180" width="100" height="40" rx="5" fill="#2196F3"/>
  <text x="400" y="205" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Find Driver</text>
  
  <!-- Driver Accepts -->
  <path d="M 400 220 L 400 250" stroke="#333" stroke-width="2" fill="none"/>
  <rect x="350" y="250" width="100" height="40" rx="5" fill="#E91E63"/>
  <text x="400" y="275" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Accept Ride</text>
  
  <!-- Fork -->
  <path d="M 400 290 L 400 320" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 400 320 L 300 320 L 300 350" stroke="#333" stroke-width="2" fill="none"/> <!-- Left branch -->
  <path d="M 400 320 L 500 320 L 500 350" stroke="#333" stroke-width="2" fill="none"/> <!-- Right branch -->
  
  <!-- Passenger Waits -->
  <rect x="250" y="350" width="100" height="40" rx="5" fill="#FF9800"/>
  <text x="300" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Wait</text>
  
  <!-- Driver Drives -->
  <rect x="450" y="350" width="100" height="40" rx="5" fill="#E91E63"/>
  <text x="500" y="375" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Drive to Pickup</text>
  
  <!-- Join -->
  <path d="M 300 390 L 300 420 L 400 420" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 500 390 L 500 420 L 400 420" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M 400 420 L 400 450" stroke="#333" stroke-width="2" fill="none"/>
  
  <!-- Driver Arrives -->
  <rect x="350" y="450" width="100" height="40" rx="5" fill="#E91E63"/>
  <text x="400" y="475" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Arrive</text>
  
  <!-- Passenger Boards -->
  <path d="M 400 490 L 400 520" stroke="#333" stroke-width="2" fill="none"/>
  <rect x="350" y="520" width="100" height="40" rx="5" fill="#FF9800"/>
  <text x="400" y="545" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Board</text>
  
  <!-- Trip Starts -->
  <path d="M 400 560 L 400 590" stroke="#333" stroke-width="2" fill="none"/>
  <rect x="350" y="590" width="100" height="40" rx="5" fill="#2196F3"/>
  <text x="400" y="615" font-family="Arial" font-size="12" text-anchor="middle" fill="white">Trip Starts</text>
  
  <!-- End Node -->
  <circle cx="400" cy="650" r="15" fill="#F44336"/>
  <text x="400" y="655" font-family="Arial" font-size="12" text-anchor="middle" fill="white">End</text>
  
  <!-- Color Legend -->
  <rect x="50" y="50" width="20" height="20" fill="#FF9800"/>
  <text x="80" y="65" font-family="Arial" font-size="12">Passenger Actions</text>
  
  <rect x="50" y="80" width="20" height="20" fill="#E91E63"/>
  <text x="80" y="95" font-family="Arial" font-size="12">Driver Actions</text>
  
  <rect x="50" y="110" width="20" height="20" fill="#2196F3"/>
  <text x="80" y="125" font-family="Arial" font-size="12">System Actions</text>
</svg>
</body>
</html>
